# FT-991A capability profile. Values: true | false | "unverified".
# "unverified" is treated as false by the UI.
# Source: FT-991A CAT Operation Reference Manual 1711-D (page numbers are the manual's).
# Comment markers are read by tools/gen_capability_doc.py (docs/01-capability-matrix.md): "BENCH-VERIFIED" = confirmed on a real radio,
# "NOT bench-verified" = implemented from the manual but never tried on a real radio; no marker = used on the real radio without problems.
[model]
id = "ft991a"
name = "Yaesu FT-991A"
cat_id = "0670"                       # ID; -> ID0670;  (p.10)
verified_source = "FT-991A_CAT_OM_ENG_1711-D"
bench_tested = true                   # the core functions were bench-tested on a real radio (docs/bench-results.md)
is_mock = false

[features]
vhf = true                            # BS 15 (p.5)
uhf = true                            # BS 16
antenna_switching = false             # no antenna-select opcode in command list (p.3)
swr_meter = true                      # RM6 (p.15)
alc_meter = true                      # RM4
comp_meter = true                     # RM3
ptt = true                            # TX0/TX1 (p.17). BENCH-VERIFIED (operator: PTT works on the Pi image, 2026-10-03)
power_off_cat = true                  # PS0 (p.14)
power_on_cat = true                   # PS1 (p.15): dummy data, then PS1 after 1-2 s. BENCH-VERIFIED (power on and off both work over USB from standby)
c4fm = true                           # MD0E (p.11), mode select only
dnr = true                            # NR/RL
noise_blanker = true                  # NB/NL
auto_notch = true                     # BC
manual_notch = true                   # BP
contour = true                        # CO
apf = "unverified"                   # CO P2=2/3. Audio peak filter is CW-only; reported as not working on the bench, so it is not offered
if_shift = true                       # IS
width = true                          # SH
agc = true                            # GT0 + 0..4 (OFF/FAST/MID/SLOW/AUTO); the answer reports AUTO-FAST/MID/SLOW as 4/5/6. BENCH-VERIFIED
ipo = true                            # PA
att = true                            # RA
rit = true                            # RT/RU/RD
xit = true                            # XT
processor = true                      # PR/PL
monitor = true                        # ML
tuner = true                          # AC00x tuner on/off (does not transmit)
tuner_tune = true                     # AC002 start/stop tune: KEYS the transmitter; goes through TxGuard. BENCH-VERIFIED (operator: "tuning works")
mic_select = true                    # EX106 (menu 106 SSB MIC SELECT: 0 MIC / 1 REAR, manual p.9). Read at connect. BENCH-VERIFIED (REAR/MIC switch works)
memories = true                       # MC select + MT read (p.11): list and recall stored channels; never written. BENCH-VERIFIED (the radio answers every MT with channel 001: handled)
memory_edit = true                    # MT write (p.11): add / edit a channel (frequency, mode, name, shift direction, tone mode), read back and checked after every write. NEW: only simulator-tested until tried on a real radio
dgid = true                         # EX153 (menu 153 WIRES DG-ID, p.9); one value, no separate TX/RX item in the CAT manual. Read only: the C4FM RX/TX DG-ID is not reachable over CAT
split = true                          # FT (p.9): FT3; TX on B (split), FT2; TX on A. BENCH-VERIFIED (FT; -> FT0;, FT3; -> FT1;, FT2; -> FT0;)
quick_split = true                    # QS; (p.15): sets B from A with the menu-035 offset and turns split on. NOT bench-verified
vfo_b = true                          # FB read/set (p.9), AB A->B (p.3), BA B->A, SV swap (p.17); no select-VFO command exists

[frequency]
ranges = [[30000, 470000000]]         # FA range (p.9); real RX coverage has gaps -> unverified

[modes]
list = ["LSB", "USB", "CW-U", "FM", "AM", "RTTY-L", "CW-L", "DATA-L", "RTTY-U", "DATA-FM", "FM-N", "DATA-U", "AM-N", "C4FM"]

[levels.af_gain]
min = 0
max = 255
label = "AF Gain"
[levels.rf_gain]
min = 0
max = 255
label = "RF Gain"
[levels.mic_gain]
min = 0
max = 100
label = "Mic Gain"
[levels.squelch]
min = 0
max = 100
label = "Squelch"
[levels.rf_power]
min = 5
max = 100
label = "TX Power"

[bands]
list = ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m", "AIR", "2m", "70cm"]

