# Yaesu FTDX10 capability profile. Values: true | false | "unverified" ("unverified" is treated as false by the UI).
# Written from the CAT manual (FTDX10_CAT_OM_ENG_2308-F) and tested on a real FTDX10 on 2026-10-30/31 (receive controls, VFOs, split, menu, meters,
# speech processor); transmitting audio over USB and the Tune button were not yet tried. [model] bench_tested = true: no "experimental profile" banner.
[model]
id = "ftdx10"
name = "Yaesu FTDX10"
cat_id = "0761"                        # ID; -> ID0761;
verified_source = "FTDX10_CAT_OM_ENG_2308-F"
bench_tested = true
is_mock = false

[features]
menu = true                           # the radio's own menu through the EX command: radio/menus/ftdx10.json, built from the CAT manual (never tried on a radio)
cw_text = true                        # typed CW through the radio's keyer memories: KM P1 text; / KY P1; (FTDX10 CAT manual p.15-16, identical to the FT-991A's); never tried on a radio
vhf = false
uhf = false
antenna_switching = false
swr_meter = true                      # RM6
alc_meter = true                      # RM4
comp_meter = true                     # RM3
ptt = true                            # TX1 / TX0
power_off_cat = true                  # PS0
power_on_cat = true                   # PS1 after dummy data (1-2 s)
c4fm = false
dnr = true                            # NR / RL
noise_blanker = true                  # NB / NL
auto_notch = true                     # BC
manual_notch = true                   # BP
contour = true                        # CO
apf = "unverified"                    # CW-only audio peak filter: not offered (did nothing on the FT-991A)
if_shift = true                       # IS (0..1200 Hz, 20 Hz steps)
width = true                          # SH (Table 3)
agc = true                            # GT: OFF / FAST / MID / SLOW / AUTO
ipo = true                            # PA
att = false
att_levels = true                     # RA: OFF / 6 / 12 / 18 dB
rit = true
xit = true
processor = true                      # PR0 / PL: bench-verified on the real radio (PR00 = off, PR01 = on)
monitor = true                        # ML
tuner = true                          # AC00x tuner on/off (does not transmit)
tuner_tune = true                    # AC002 start/stop tune: KEYS the transmitter (goes through TxGuard). Enabled at the owner's request (2026-10-30), before a first real tune had been seen
mic_select = true                     # EX SSB mod source menu
dgid = false
memories = "unverified"               # MC / MT exist in the manual; not implemented for this radio yet
split = true                          # ST
quick_split = false                   # not offered: the owner does not need it (QS works on the radio: B goes 5 kHz above A and split turns on)
vfo_b = true                          # FB / OI / AB / BA; the swap is done with FA / FB (SV only switches the operating VFO on this radio)
vfo_select = true                     # VS: which VFO the radio's dial operates (A or B); read only, the page shows it

[frequency]
ranges = [[30000, 75000000]]          # FA / FB (manual)

[modes]
list = ["LSB", "USB", "CW-U", "CW-L", "AM", "FM", "DATA-U", "DATA-L", "RTTY-L", "RTTY-U", "PSK", "AM-N", "FM-N", "DATA-FM"]

[levels.af_gain]
min = 0
max = 255
label = "AF Gain"
[levels.rf_gain]
min = 0
max = 255
label = "RF Gain"
[levels.mic_gain]
min = 0
max = 100
label = "Mic Gain"
[levels.rf_power]
min = 5
max = 100
label = "TX Power"

# What the FTDX10's own panel and menus call these (reported by an owner with the radio)
[labels]
auto_notch = "DNF"
notch = "NOTCH"
rit = "CLAR RX"
xit = "CLAR TX"

[bands]
list = ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]
