# Yaesu FTDX101MP capability profile. Values: true | false | "unverified" ("unverified" is treated as false by the UI).
# The MP uses the same CAT commands as the FTDX101D (one shared manual, FTDX101MP_D_CAT_OM_ENG_2101-I), so it is enabled exactly like the D, which was tested on a real radio.
# No FTDX101MP has been available here; bench_tested = true (no "experimental profile" banner) because the commands are identical to the tested D. The only differences are the ID and the transmit power: 5 to 200 W.
[model]
id = "ftdx101mp"
name = "Yaesu FTDX101MP"
cat_id = "0682"                        # ID; -> ID0682;
verified_source = "FTDX101MP_D_CAT_OM_ENG_2101-I"
bench_tested = true
is_mock = false

[features]
vhf = false
uhf = false
antenna_switching = false
swr_meter = true                      # RM6
alc_meter = true                      # RM4
comp_meter = true                     # RM3
ptt = true                            # TX1 / TX0
power_off_cat = true                  # PS0
power_on_cat = true                   # PS1 after dummy data (1-2 s)
c4fm = false
dnr = true                            # NR / RL
noise_blanker = true                  # NB / NL
auto_notch = true                     # BC
manual_notch = true                   # BP
contour = true                        # CO
apf = "unverified"                    # CW-only audio peak filter: not offered (did nothing on the FT-991A)
if_shift = true                       # IS (0..1200 Hz, 20 Hz steps)
width = true                          # SH (Table 3)
agc = true                            # GT: OFF / FAST / MID / SLOW / AUTO
ipo = true                            # PA
att = false
att_levels = true                     # RA: OFF / 6 / 12 / 18 dB
rit = true
xit = true
processor = true                      # PR0 / PL: same command as the FTDX101D, where it was bench-verified (0 = OFF, 1 = ON; the manual's 1 / 2 is wrong, PR02 gets ?;)
monitor = true                        # ML
tuner = true                          # AC00x tuner on/off (does not transmit)
tuner_tune = true                    # AC002; = tuning start/stop (CAT manual: P3 2). KEYS the transmitter: enabled at the user's request, the app asks for confirmation (dummy load or antenna) and the TX guard applies
mic_select = true                     # EX SSB mod source menu
dgid = false
memories = true                      # MT / MR read + MC recall + VM (the V/M key): same command as the FTDX101D, where it was bench-verified (read only, nothing is ever written)
split = "unverified"                          # ST
quick_split = "unverified"                    # QS
vfo_b = true                                  # FB / OI: same command as the FTDX101D, where it was bench-verified (FA 14.150500 / FB 7.000500 followed VFO-A / VFO-B); the AB / BA / SV buttons are not yet tried
audio_out_level = true                  # EX 01 01 09 (and AM / FM): the CAT manual p.10; level sent to the USB audio
audio_in_level = true                   # EX 01 01 13 RPORT GAIN: audio coming in from the USB
rear_select = true                    # REAR SELECT DATA / USB (SSB, AM, FM, DATA): the transmit audio source from the rear
amc_level = true                       # AO: same command as the FTDX101D (AO070)
cw_keyer = true                       # KS / KP / KR / BI: same command as the FTDX101D (SD is left out: the radio answers 2 digits, the manual says 4)
dual_receiver = true                       # FA = MAIN receiver (VFO-A), FB / OI = SUB receiver: the app says MAIN / SUB and hides the A/B copy and swap buttons
# split / quick_split stay off until tried on the radio

[frequency]
ranges = [[30000, 75000000]]          # FA / FB (manual)

[modes]
list = ["LSB", "USB", "CW-U", "CW-L", "AM", "FM", "DATA-U", "DATA-L", "RTTY-L", "RTTY-U", "PSK", "AM-N", "FM-N", "DATA-FM"]

[levels.af_gain]
min = 0
max = 255
label = "AF Gain MAIN"
[levels.af_gain_sub]
min = 0
max = 255
label = "AF Gain SUB"
[levels.rf_gain]
min = 0
max = 255
label = "RF Gain MAIN"
[levels.rf_gain_sub]
min = 0
max = 255
label = "RF Gain SUB"
[levels.mic_gain]
min = 0
max = 100
label = "Mic Gain"
[levels.rf_power]
min = 5
max = 200
label = "TX Power"

[bands]
list = ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]
