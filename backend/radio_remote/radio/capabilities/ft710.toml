# Yaesu FT-710 capability profile. Values: true | false | "unverified" ("unverified" is treated as false by the UI).
# EXPERIMENTAL: written from the CAT manual (FT-710_CAT_OM_ENG_2306-C) and connected to a real FT-710 on 2026-10-31 (receive controls, clarifier, menu,
# meters); voice from the app did not modulate on that radio, so [model] bench_tested = false and the app shows an "experimental profile" banner.
[model]
id = "ft710"
name = "Yaesu FT-710"
cat_id = "0800"                        # ID; -> ID0800;
verified_source = "FT-710_CAT_OM_ENG_2306-C"
bench_tested = false
is_mock = false

[features]
menu = true                           # the radio's own menu through the EX command: radio/menus/ft710.json, built from the CAT manual (never tried on a radio)
cw_text = true                        # typed CW through the radio's keyer memories: KM / KY as in the FTDX10 manual (the same keyer commands); not read in this radio's own manual and never tried on a radio
vhf = false
uhf = false
antenna_switching = false
swr_meter = true                      # RM6
alc_meter = true                      # RM4
comp_meter = true                     # RM3
ptt = true                            # TX1 / TX0
power_off_cat = true                  # PS0
power_on_cat = true                   # PS1 after dummy data (1-2 s)
c4fm = false
dnr = true                            # NR / RL
noise_blanker = true                  # NB / NL
auto_notch = true                     # BC
manual_notch = true                   # BP
contour = true                        # CO
apf = "unverified"                    # CW-only audio peak filter: not offered (did nothing on the FT-991A)
if_shift = true                       # IS (0..1200 Hz, 20 Hz steps)
width = true                          # SH (Table 3)
agc = true                            # GT: OFF / FAST / MID / SLOW / AUTO
ipo = true                            # PA
att = false
att_levels = true                     # RA: OFF / 6 / 12 / 18 dB
rit = true                           # CF000 (RX CLAR / TX CLAR flags) and CF001 (offset): bench-verified on a real FT-710 (RT/XT/RC/RU/RD answer ?;)
xit = true
processor = true                       # PR0 (0 off / 1 on) and PL (3 digits, level) bench-verified on a real FT-710: PR00 off, PR01 on, PL001 at level 1
monitor = true                        # ML
tuner = true                          # AC00x tuner on/off (does not transmit)
tuner_tune = true                     # AC003 starts, AC000 stops the tuner (FT-710 p.4); KEYS the transmitter: enabled at the operator's request, not yet tried on a dummy load
mic_select = true                     # EX SSB mod source menu
dgid = false
memories = "unverified"               # MC / MT exist in the manual; not implemented for this radio yet
split = true                          # ST
quick_split = false                  # no QS in the FT-710 manual                    # QS
vfo_b = true                          # FB / OI / AB / BA / SV
vfo_select = true                     # VS0 / VS1 (the VFO the dial operates), bench-verified on a real FT-710: SV; only toggles it, like the FTDX10

[frequency]
ranges = [[30000, 75000000]]          # FA / FB (manual)

[modes]
list = ["LSB", "USB", "CW-U", "CW-L", "AM", "FM", "DATA-U", "DATA-L", "RTTY-L", "RTTY-U", "PSK", "AM-N", "FM-N", "DATA-FM"]

[levels.af_gain]
min = 0
max = 255
label = "AF Gain"
[levels.rf_gain]
min = 0
max = 255
label = "RF Gain"
[levels.mic_gain]
min = 0
max = 100
label = "Mic Gain"
[levels.rf_power]
min = 5
max = 100
label = "TX Power"

[bands]
list = ["160m", "80m", "60m", "40m", "30m", "20m", "17m", "15m", "12m", "10m", "6m"]

[labels]
auto_notch = "DNF"
notch = "NOTCH"
rit = "CLAR RX"
xit = "CLAR TX"
