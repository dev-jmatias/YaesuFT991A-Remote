name: Build the RADE library

# Builds the optional RADE library (scripts/build_rade_container.sh: inside a Debian 12 container, so it also runs on Debian 12 and newer) for
# 64-bit ARM (Raspberry Pi) and for a 64-bit PC (x86_64) on native runners, loads it once as a self-test, runs the FreeDV tests against it and prints
# how much CPU each FreeDV mode needs. The libraries are uploaded as artifacts you can try with `sudo scripts/install_rade.sh --file <file>` before a
# release. A release (a tag push) builds them again, see build-image.yml.
on:
  workflow_dispatch:

jobs:
  rade:
    strategy:
      matrix:
        include:
          - {runner: ubuntu-24.04-arm, arch: aarch64}
          - {runner: ubuntu-24.04, arch: x86_64}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the RADE library (Debian 12 container, with a load test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcodec2-dev
          bash scripts/build_rade_container.sh rade-out

      - name: FreeDV tests against the real libraries, and the CPU cost on this hardware
        env:
          RADIO_REMOTE_RADE_LIB: ${{ github.workspace }}/rade-out/librade-rr.so
        run: |
          pip install -r requirements.txt pytest pytest-asyncio markdown
          PYTHONPATH=backend python -m pytest -q tests/test_rade_codec.py tests/test_freedv_codec.py tests/test_freedv.py tests/test_freedv_tune.py
          python scripts/freedv_probe.py | tee freedv-cpu.txt

      - uses: actions/upload-artifact@v4
        with:
          name: radio-remote-rade-linux-${{ matrix.arch }}
          path: |
            rade-out/radio-remote-rade-linux-*.tar.xz
            freedv-cpu.txt
          if-no-files-found: error
          retention-days: 14
