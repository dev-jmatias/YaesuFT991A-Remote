name: Build the RADE library

# Builds the optional RADE library (scripts/build_rade.sh) for 64-bit ARM on a native runner, runs the FreeDV tests against it and prints
# how much CPU each FreeDV mode needs. The library is uploaded as an artifact (radio-remote-rade-linux-aarch64.tar.xz) you can try on a Pi
# with `sudo scripts/install_rade.sh --file <file>` before a release. A release (a tag push) builds it again, see build-image.yml.
on:
  workflow_dispatch:

jobs:
  rade:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Build the RADE library
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq cmake build-essential autoconf automake libtool curl git libcodec2-dev
          bash scripts/build_rade.sh rade-out

      - name: FreeDV tests against the real libraries, and the CPU cost on this hardware
        env:
          RADIO_REMOTE_RADE_LIB: ${{ github.workspace }}/rade-out/librade-rr.so
        run: |
          pip install -r requirements.txt pytest pytest-asyncio markdown
          PYTHONPATH=backend python -m pytest -q tests/test_rade_codec.py tests/test_freedv_codec.py tests/test_freedv.py
          python scripts/freedv_probe.py | tee freedv-cpu.txt

      - uses: actions/upload-artifact@v4
        with:
          name: radio-remote-rade-linux-aarch64
          path: |
            rade-out/radio-remote-rade-linux-*.tar.xz
            freedv-cpu.txt
          if-no-files-found: error
          retention-days: 14
