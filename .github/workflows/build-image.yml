name: Build Raspberry Pi image

# Builds a ready-to-flash 64-bit Raspberry Pi OS Lite image with Radio Remote installed (pi-gen, via usimd/pi-gen-action).
# Run it by hand (Actions > Build Raspberry Pi image > Run workflow) or push a tag such as v1.0.0 to also create a release.
on:
  workflow_dispatch:
    inputs:
      release:
        description: "Debian release of the base image (Raspberry Pi OS current: trixie; older: bookworm)"
        default: "trixie"
      runner:
        description: "ubuntu-24.04 (works everywhere, builds under emulation: slower) or ubuntu-24.04-arm (fast, public repositories only)"
        default: "ubuntu-24.04"
  push:
    tags: ["v*"]

jobs:
  # RADE library for a 64-bit PC (the image job below builds the one for ARM). Built in a Debian 12 container so it also runs on Debian 12 and newer.
  rade-x86:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - name: Build the RADE library for x86_64 (Debian 12 container, with a load test)
        run: bash scripts/build_rade_container.sh rade-out
      - uses: actions/upload-artifact@v4
        with:
          name: rade-x86_64
          path: rade-out/radio-remote-rade-linux-x86_64.tar.xz
          if-no-files-found: error
          retention-days: 3

  image:
    needs: rade-x86
    # native arm64 runner (free for public repositories, no emulation). A private repository has none: pick ubuntu-24.04 by hand
    runs-on: ${{ inputs.runner || 'ubuntu-24.04-arm' }}
    timeout-minutes: 240
    permissions:
      contents: write        # to create the release and attach the image
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      # RADE (neural FreeDV mode): built from source for this architecture (about 5 minutes) and shipped as its own optional download.
      # Building it first lets the tests below run against the real library on the real (arm64) hardware, together with libcodec2.
      - name: Build the RADE library for ARM (Debian 12 container, with a load test)
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq libcodec2-dev
          bash scripts/build_rade_container.sh rade-out

      - uses: actions/download-artifact@v4
        with:
          name: rade-x86_64
          path: rade-out

      - name: Run the tests
        env:
          RADIO_REMOTE_RADE_LIB: ${{ github.workspace }}/rade-out/librade-rr.so
        run: |
          pip install -r requirements.txt pytest pytest-asyncio markdown
          PYTHONPATH=backend python -m pytest -q

      - name: Build the manual and stage the program
        run: |
          python scripts/build_docs.py
          RADE_FILE=rade-out/radio-remote-rade-linux-aarch64.tar.xz bash image/stage_program.sh

      - name: Build the image
        id: build
        uses: usimd/pi-gen-action@v1
        with:
          image-name: radio-remote
          stage-list: stage0 stage1 stage2 ./image/stage-radio-remote
          release: ${{ inputs.release || 'trixie' }}
          pi-gen-version: arm64
          hostname: radio
          username: pi
          # no password is set (the account stays locked): the user sets name, password, Wi-Fi and hostname with
          # image/first-boot-settings.ps1 (or Raspberry Pi Imager's "Edit settings" in versions that offer it for custom images).
          enable-ssh: 1
          locale: en_GB.UTF-8
          timezone: Europe/London
          compression: xz
          verbose-output: true

      # Everything a release offers, in one folder with one SHA256SUMS:
      #   the image, first-boot-settings.ps1, radio-remote-vX.tar.gz (what self_update.sh / the update notice use) and the installer zip
      - name: Build the release files
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then TAG="$GITHUB_REF_NAME"; else TAG=auto; fi   # a tag must match __version__
          # os-list.json: lets Raspberry Pi Imager 2.x list the image with its own hostname / user / password / Wi-Fi screens
          python scripts/build_imager_repo.py --image "${{ steps.build.outputs.image-path }}" --tag "$TAG" \
            --repo "$GITHUB_REPOSITORY" --out os-list.json
          python scripts/build_release_assets.py --tag "$TAG" --out release-assets --installer --skip-docs \
            --rade-file rade-out/radio-remote-rade-linux-aarch64.tar.xz \
            --extra "${{ steps.build.outputs.image-path }}" image/first-boot-settings.ps1 os-list.json rade-out/radio-remote-rade-linux-*.tar.xz
          cat release-assets/SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: radio-remote-release-files
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

      - name: Attach to the release (tags only)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          name: Radio Remote ${{ github.ref_name }}
          body_path: image/RELEASE-NOTES.md
          files: release-assets/*
